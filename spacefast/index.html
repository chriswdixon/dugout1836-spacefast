<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Dugout 1836</title>
<style>
  :root{
    --field:#1f6f43; --field-dark:#14502f; --dirt:#b5794a; --ink:#12201a; --muted:#5c6b63;
    --bg:#f4f6f2; --card:#ffffff; --line:#e2e8e0; --gold:#d8a45f; --accent:#1f6f43;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent)}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px}
  header.top{background:linear-gradient(135deg,var(--field),var(--field-dark));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 0 14px}
  header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em}
  .brand .mark{width:30px;height:30px;border-radius:50%;background:var(--dirt);display:grid;place-items:center;color:#fff;font-size:15px;box-shadow:inset 0 0 0 2px #fff3}
  nav.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--field-dark)}
  nav.tabs .wrap{display:flex;gap:2px}
  nav.tabs button{background:none;border:0;color:#dfeee6;padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
  nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--gold)}
  main{padding:22px 0 60px}
  h1{font-size:1.5rem;margin:.2rem 0 1rem}
  h2{font-size:1.05rem;margin:1.6rem 0 .6rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .muted{color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .tblwrap{overflow-x:auto}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
  .win{background:#dcfce7;color:#166534}.loss{background:#fee2e2;color:#991b1b}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .stat{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .stat .n{font-size:1.6rem;font-weight:800}.stat .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  /* auth */
  .auth{max-width:380px;margin:8vh auto;padding:0 16px}
  .auth .card{padding:22px}
  label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fbfdfb}
  input:focus{outline:2px solid var(--field);border-color:var(--field)}
  button.primary{width:100%;margin-top:16px;background:var(--field);color:#fff;border:0;border-radius:8px;padding:11px;font-size:15px;font-weight:700;cursor:pointer}
  button.primary:disabled{opacity:.6}
  button.link{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13px;padding:6px 0;text-decoration:underline}
  .err{color:#991b1b;font-size:13px;margin-top:10px;min-height:18px}
  .note{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px}
  .signout{background:#ffffff22;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .empty{color:var(--muted);padding:14px 0}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = ""; // same-origin worker
const KEY = "dugout.auth";
const el = (id) => document.getElementById(id);
let session = load();

function load(){ try{ return JSON.parse(localStorage.getItem(KEY) || "null"); }catch{ return null; } }
function save(s){ session = s; s ? localStorage.setItem(KEY, JSON.stringify(s)) : localStorage.removeItem(KEY); }

async function api(path, opts={}){
  const headers = Object.assign({ "content-type":"application/json" }, opts.headers||{});
  if(session?.token) headers["authorization"] = "Bearer " + session.token;
  const res = await fetch(API + path, Object.assign({}, opts, { headers }));
  const txt = await res.text();
  let body; try{ body = txt ? JSON.parse(txt) : null; }catch{ body = txt; }
  if(!res.ok) throw Object.assign(new Error((body&&body.error)||("HTTP "+res.status)), {status:res.status, body});
  return body;
}

// ---------- auth screen ----------
function renderAuth(mode="login"){
  const isLogin = mode === "login";
  el("app").innerHTML = `
   <div class="auth">
     <div class="brand" style="justify-content:center;color:var(--field);font-size:20px;margin-bottom:14px">
       <span class="mark">⚾</span> The Dugout 1836</div>
     <div class="card">
       <h1 style="text-align:center;font-size:1.2rem;margin:.2rem 0 1rem">${isLogin?"Sign in":"Create your account"}</h1>
       <form id="af">
         ${isLogin?"":`<label>Full name</label><input name="fullName" autocomplete="name" />`}
         <label>Email</label><input name="email" type="email" autocomplete="email" required />
         <label>Password</label><input name="password" type="password" autocomplete="${isLogin?"current-password":"new-password"}" required />
         ${isLogin?"":`<label>Invite code (optional)</label><input name="code" placeholder="from your coach" />`}
         <button class="primary" type="submit">${isLogin?"Sign in":"Sign up"}</button>
       </form>
       <div class="err" id="aerr"></div>
       <div style="text-align:center;margin-top:6px">
         <button class="link" id="toggle">${isLogin?"Need an account? Sign up":"Have an account? Sign in"}</button>
       </div>
     </div>
   </div>`;
  el("toggle").onclick = () => renderAuth(isLogin ? "signup" : "login");
  el("af").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target); const btn = e.target.querySelector("button"); btn.disabled = true;
    const payload = Object.fromEntries(f.entries());
    try{
      const out = await api(isLogin ? "/api/auth/login" : "/api/auth/signup", { method:"POST", body: JSON.stringify(payload) });
      save(out);
      if(!isLogin && out.profile && out.profile.status !== "approved"){ renderPending(out); return; }
      renderApp();
    }catch(err){ el("aerr").textContent = err.message; btn.disabled = false; }
  };
}

function renderPending(out){
  el("app").innerHTML = `<div class="auth"><div class="card" style="text-align:center">
    <div class="brand" style="justify-content:center;color:var(--field);font-size:18px;margin-bottom:10px"><span class="mark">⚾</span> The Dugout 1836</div>
    <h1 style="font-size:1.15rem">You're on the list</h1>
    <p class="muted">Your account was created and is waiting for a coach to approve it. Check back soon.</p>
    <button class="link" id="so">Sign out</button></div></div>`;
  el("so").onclick = () => { save(null); renderAuth(); };
}

// ---------- app shell ----------
const TABS = [["home","Home"],["roster","Roster"],["schedule","Schedule"],["stats","Stats"]];
let current = "home";

function renderApp(){
  const approved = session?.profile?.status === "approved" || (session?.roles||[]).includes("admin");
  el("app").innerHTML = `
   <header class="top"><div class="wrap">
     <div class="brand"><span class="mark">⚾</span> The Dugout 1836</div>
     <div style="display:flex;align-items:center;gap:10px">
       <span style="font-size:13px;opacity:.9">${(session?.user?.email)||""}</span>
       <button class="signout" id="signout">Sign out</button></div>
   </div></header>
   <nav class="tabs"><div class="wrap" id="tabs"></div></nav>
   <main><div class="wrap" id="view"></div></main>`;
  el("signout").onclick = async () => { try{ await api("/api/auth/logout",{method:"POST"});}catch{} save(null); renderAuth(); };
  const tabsEl = el("tabs");
  TABS.forEach(([id,label])=>{
    const b = document.createElement("button"); b.textContent = label; b.setAttribute("aria-selected", id===current);
    b.onclick = () => { current = id; renderApp(); }; tabsEl.appendChild(b);
  });
  if(!approved){ el("view").innerHTML = `<div class="note">Your account is pending approval, so team content is hidden until a coach approves you.</div>`; return; }
  ({home:viewHome, roster:viewRoster, schedule:viewSchedule, stats:viewStats}[current] || viewHome)();
}

const fmtDate = (s)=>{ try{ return new Date(s).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }catch{ return s; } };
const loadingCard = (t)=> `<div class="card"><div class="empty">Loading ${t}…</div></div>`;

async function viewHome(){
  el("view").innerHTML = `<h1>Home</h1><div id="hs"></div><h2>Next up</h2><div id="he">${loadingCard("schedule")}</div>`;
  try{
    const [events, players] = await Promise.all([ api("/api/data/events"), api("/api/data/players") ]);
    const upcoming = events.filter(e=> new Date(e.starts_at) >= new Date()).slice(0,5);
    const past = events.filter(e=> e.score_us!=null && e.score_them!=null);
    const wins = past.filter(e=> e.score_us>e.score_them).length, losses = past.filter(e=> e.score_us<e.score_them).length;
    el("hs").innerHTML = `<div class="row">
      <div class="stat"><div class="n">${players.length}</div><div class="l">Players</div></div>
      <div class="stat"><div class="n">${wins}-${losses}</div><div class="l">Record</div></div>
      <div class="stat"><div class="n">${events.length}</div><div class="l">Events</div></div></div>`;
    el("he").innerHTML = upcoming.length ? `<div class="card"><div class="tblwrap"><table><thead><tr><th>Date</th><th>Matchup</th><th>Where</th></tr></thead><tbody>${
      upcoming.map(e=>`<tr><td>${fmtDate(e.starts_at)}</td><td>${e.opponent?("vs "+esc(e.opponent)):esc(e.title||e.event_name||e.event_type)}</td><td class="muted">${esc(e.location||"")}</td></tr>`).join("")
    }</tbody></table></div></div>` : `<div class="card"><div class="empty">No upcoming events yet.</div></div>`;
  }catch(err){ fail("he",err); }
}

async function viewRoster(){
  el("view").innerHTML = `<h1>Roster</h1><div id="rr">${loadingCard("roster")}</div>`;
  try{
    const players = await api("/api/data/players");
    el("rr").innerHTML = players.length ? `<div class="card"><div class="tblwrap"><table><thead><tr><th>#</th><th>Name</th><th>Pos</th><th>Bats/Throws</th><th>Grad</th></tr></thead><tbody>${
      players.map(p=>`<tr><td>${esc(p.jersey_number||"")}</td><td><strong>${esc(p.name)}</strong></td><td>${esc(p.positions||"")}</td><td class="muted">${esc(p.bats||"-")}/${esc(p.throws||"-")}</td><td class="muted">${p.grad_year||""}</td></tr>`).join("")
    }</tbody></table></div></div>` : `<div class="card"><div class="empty">No players on the roster yet.</div></div>`;
  }catch(err){ fail("rr",err); }
}

async function viewSchedule(){
  el("view").innerHTML = `<h1>Schedule</h1><div id="sr">${loadingCard("schedule")}</div>`;
  try{
    const events = await api("/api/data/events");
    const rows = [...events].sort((a,b)=> new Date(b.starts_at)-new Date(a.starts_at));
    el("sr").innerHTML = rows.length ? `<div class="card"><div class="tblwrap"><table><thead><tr><th>Date</th><th>Matchup</th><th>Result</th><th>Where</th></tr></thead><tbody>${
      rows.map(e=>{ const played = e.score_us!=null&&e.score_them!=null; const win = played&&e.score_us>e.score_them;
        const res = played ? `<span class="pill ${win?"win":(e.score_us<e.score_them?"loss":"")}">${win?"W":(e.score_us<e.score_them?"L":"T")} ${e.score_us}-${e.score_them}</span>` : `<span class="muted">—</span>`;
        return `<tr><td>${fmtDate(e.starts_at)}</td><td>${e.opponent?("vs "+esc(e.opponent)):esc(e.title||e.event_name||e.event_type)}</td><td>${res}</td><td class="muted">${esc(e.location||"")}</td></tr>`; }).join("")
    }</tbody></table></div></div>` : `<div class="card"><div class="empty">No games scheduled yet.</div></div>`;
  }catch(err){ fail("sr",err); }
}

async function viewStats(){
  el("view").innerHTML = `<h1>Stats</h1><div id="st">${loadingCard("stats")}</div>`;
  try{
    const stats = await api("/api/data/player_stats");
    if(!stats.length){ el("st").innerHTML = `<div class="card"><div class="empty">No stats posted yet.</div></div>`; return; }
    const keys = [...new Set(stats.flatMap(s=> Object.keys(s.stats||{})))].slice(0,8);
    el("st").innerHTML = `<div class="card"><div class="tblwrap"><table><thead><tr><th>Player</th><th>Cat</th><th>Season</th>${keys.map(k=>`<th>${esc(k)}</th>`).join("")}</tr></thead><tbody>${
      stats.map(s=>`<tr><td><strong>${esc(s.player_name||"")}</strong></td><td class="muted">${esc(s.category)}</td><td class="muted">${esc(s.season)}</td>${keys.map(k=>`<td>${esc(String((s.stats||{})[k] ?? ""))}</td>`).join("")}</tr>`).join("")
    }</tbody></table></div></div>`;
  }catch(err){ fail("st",err); }
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fail(id,err){ el(id).innerHTML = `<div class="card"><div class="err" style="min-height:0">Couldn't load: ${esc(err.message)}</div></div>`; if(err.status===401){ save(null); renderAuth(); } }

// ---------- boot ----------
(async function(){
  if(!session){ renderAuth(); return; }
  try{ const s = await api("/api/auth/session"); if(s && s.user){ save(Object.assign({}, session, s)); renderApp(); } else { save(null); renderAuth(); } }
  catch{ renderApp(); } // offline-ish: trust cached session
})();
</script>
</body>
</html>
